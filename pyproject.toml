[project]
name = "colored-mnist-shortcuts"
version = "0.1.0"
description = "Controlled Colored MNIST benchmark for studying shortcut learning and background reliance."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=1.26,<3.0",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision>=0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colored_mnist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

